<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Ecommerce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Mini Ecommerce</h1>
    <p>Catálogo de produtos em cards</p>
  </header>

  <main>
    <section class="controles">
      <input id="search" type="text" placeholder="Buscar produto pelo nome...">
      <select id="category">
        <option value="Todas">Todas</option>
      </select>
      <button id="btnRender">Renderizar</button>
    </section>

    <div id="product-list"></div>

    <section>
      <h2>Detalhes do produto</h2>
      <div id="product-details">Clique em "Ver detalhes" em algum card.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
